[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes/stream-json"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bridle-api = { path = "crates/bridle-api" }
bridle-claude = { path = "crates/bridle-claude" }
bridle-daemon = { path = "crates/bridle-daemon" }
bridle-docs = { path = "crates/bridle-docs" }
bridle-gateway = { path = "crates/bridle-gateway" }
bridle-mail = { path = "crates/bridle-mail" }
bridle-tui = { path = "crates/bridle-tui" }
bridle-spec = { path = "crates/bridle-spec" }

anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
hex = "0.4"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
