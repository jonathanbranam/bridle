# Bridle's own roles, for running bridle on itself.
# Reference: docs/design/agent-host/roles-and-config.md

[daemon]
stall_after = "10m"

[roles.worker]
model            = "sonnet"
effort           = "medium"
workdir          = "worktree"
permission_mode  = "acceptEdits"
allowed_tools    = ["Bash", "Read", "Edit", "Write", "Glob", "Grep"]
# A worker merges the local main into its own branch; its worktree can't check out main, and
# remote refs are stale (only the merger pushes), so no fetching or merging from origin.
# SendMessage is Claude Code's own messaging, which bypasses bridle; workers use `bridle send`.
disallowed_tools = ["Bash(git push *)", "Bash(git checkout main*)", "Bash(git fetch *)", "Bash(git pull *)", "Bash(git merge origin*)", "SendMessage"]
system_prompt    = ".bridle/roles/worker.md"
# Per process, a runaway guard only: claude checks it after each model call, and
# `bridle resume` grants a fresh allowance. The cost is list price, a relative
# unit on a subscription. Pacing belongs to the account's windows (the budget
# governor), not to this cap, so it's set well above a normal task.
max_budget_usd   = 50.0

[roles.manager]
model             = "sonnet"
workdir           = "repo"
permission_mode   = "dontAsk"
allowed_tools     = ["Bash(bridle *)", "Bash(git log*)", "Bash(git diff*)", "Bash(git show*)", "Bash(git status*)", "Bash(git branch*)", "Bash(git merge-base *)", "Bash(git merge --no-ff *)", "Bash(git push origin main)", "Bash(git -C * status*)", "Read", "Glob", "Grep"]
# Claude Code's own cross-session messaging bypasses bridle; agents talk with `bridle send`.
disallowed_tools  = ["SendMessage"]
system_prompt     = ".bridle/roles/manager.md"
resume_on_restart = true
max_budget_usd    = 50.0
start_prompt      = """
You're starting up. Run `bridle status --json`, `bridle agents --json` and \
`bridle inbox --json`, then send the human one short line saying you're ready \
and what, if anything, is already in flight. Then wait for work."""
