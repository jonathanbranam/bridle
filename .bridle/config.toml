# Bridle's own roles, for running bridle on itself.
# Reference: docs/design/agent-host/roles-and-config.md

# L1 base layer, in-repo (docs/design/workflow-layers.md). No L2 packs yet.
workflow = "workflow"

[daemon]
stall_after = "10m"
self_upgrade = true

# Explicit even though it matches the built-in default, so bridle's own
# choice is visible next to projects (e.g. data-contracts) that bind
# `make check` instead (docs/design/workflow-layers.md).
[commands]
check = "just check"

[ci]
github = true

[integration]
check = "just check"

[roles.worker]
model            = "sonnet"
effort           = "medium"
workdir          = "worktree"
permission_mode  = "acceptEdits"
allowed_tools    = ["Bash", "Read", "Edit", "Write", "Glob", "Grep"]
# A worker merges the local main into its own branch; its worktree can't check out main, and
# remote refs are stale (only the merger pushes), so no fetching or merging from origin.
# (SendMessage and friends are denied by bridle's own built-in worker default.)
disallowed_tools = ["Bash(git push *)", "Bash(git checkout main*)", "Bash(git fetch *)", "Bash(git pull *)", "Bash(git merge origin*)"]
system_prompt    = "workflow/base/roles/worker.md"
# Per process, a runaway guard only: claude checks it after each model call, and
# `bridle resume` grants a fresh allowance. The cost is list price, a relative
# unit on a subscription. Pacing belongs to the account's windows (the budget
# governor), not to this cap, so it's set well above a normal task.
max_budget_usd   = 50.0

[roles.product-manager]
# Owns the backlog and prepares right-sized tasks; the manager (development manager) runs them.
# Interim split by configuration (ticket tx3f). Read-only on the repo; talks through bridle.
model             = "sonnet"
workdir           = "repo"
permission_mode   = "dontAsk"
allowed_tools     = ["Bash(bridle *)", "Bash(git log*)", "Bash(git diff*)", "Bash(git show*)", "Bash(git status*)", "Read", "Glob", "Grep", "Agent"]
tools             = ["Bash", "Read", "Glob", "Grep", "Agent"]   # removed, not just denied (spike 08)
# (SendMessage and friends are denied by bridle's own built-in worker default,
# which custom roles like this one start from.)
disallowed_tools  = ["Bash(bridle spawn*)", "Bash(bridle stop*)", "Bash(bridle rm*)", "Bash(bridle resume*)", "Bash(bridle interrupt*)", "Bash(bridle agent spawn*)", "Bash(bridle agent stop*)", "Bash(bridle agent rm*)", "Bash(bridle agent resume*)", "Bash(bridle agent interrupt*)", "Bash(bridle daemon stop*)"]
system_prompt     = "workflow/base/roles/product-manager.md"
autostart         = true
resume_on_restart = true
max_budget_usd    = 50.0
# Falls back to the built-in worker default (stop_check = true) since this is a custom
# role, not one of the three hardcoded ones; not a worker, so turn it back off.
stop_check        = false
start_prompt      = """
You're starting up. Run `bridle status --json`, `bridle agents --json` and \
`bridle inbox --json`, then send the human one short line saying you're ready. \
Then triage the backlog and keep the queue full (`bridle queue`, `bridle task plan`)."""

[roles.manager]
model             = "sonnet"
workdir           = "repo"
permission_mode   = "dontAsk"
allowed_tools     = ["Bash(bridle *)", "Bash(git log*)", "Bash(git diff*)", "Bash(git show*)", "Bash(git status*)", "Bash(git branch*)", "Bash(git merge-base *)", "Bash(git merge --no-ff *)", "Bash(git merge --squash *)", "Bash(git commit *)", "Bash(git push origin main)", "Bash(git -C * status*)", "Read", "Glob", "Grep", "Agent"]
# (SendMessage and friends are denied by bridle's own built-in manager default.)
system_prompt     = "workflow/base/roles/manager.md"
resume_on_restart = true
max_budget_usd    = 50.0
start_prompt      = """
You're starting up. Run `bridle status --json`, `bridle agents --json` and \
`bridle inbox --json`, then send the human one short line saying you're ready \
and what, if anything, is already in flight. Then wait for work."""

[orchestrator]
enabled = true
note_tokens     = "150k"    # "context at N": a heads-up
plan_tokens     = "180k"    # "plan a handover at the next quiet point"
handover_tokens = "200k"    # "hand over now"; starts the deadline below
handover_deadline = "30m"   # then the daemon stops the session and relaunches it
max_uptime      = "12h"     # a plan-a-handover at this age, whatever the size
waiter_grace    = "15m"     # no wait-for-wake running this long tells the human (the human, v9t9)

[context]
wind_down_at = { default = 150000, worker = 120000 }
