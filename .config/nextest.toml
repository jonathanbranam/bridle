# Isolate tests' git from the machine's global config, so a local run behaves
# like CI (e.g. a global init.defaultBranch=main once hid g3ck). Tests that need
# an identity or branch name set it explicitly.
[profile.default.env]
GIT_CONFIG_GLOBAL = "/dev/null"
GIT_CONFIG_NOSYSTEM = "1"

# Many tests start their own daemon, so the default (one thread per core) drove
# load past the governor and made timing-sensitive tests flake (br-7fr6).
[profile.default]
test-threads = 8
