name: release
on:
  push:
    tags: ["v*"]
  # Builds and uploads the tarballs as workflow artifacts, without publishing.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The bridle-ui build, pinned by ui.pin (t3dr). Runs only here, never in just check or CI on
  # main. bridle-ui is public, so the default token reads it.
  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < ui.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: jonathanbranam/bridle-ui
          ref: ${{ steps.pin.outputs.sha }}
          path: bridle-ui
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: bridle-ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: bridle-ui
      - name: Check the API version and record the build
        run: |
          want=$(sed -n 's/^pub const API_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/bridle-gateway/src/lib.rs)
          got=$(tr -d '[:space:]' < bridle-ui/dist/api-version)
          [ -n "$want" ] && [ "$got" = "$want" ] \
            || { echo "UI api-version '$got' != gateway API_VERSION '$want'" >&2; exit 1; }
          tag="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="dev-${GITHUB_SHA::7}"
          echo "$tag bridle-ui ${{ steps.pin.outputs.sha }}" > bridle-ui/dist/bridle-version
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: bridle-ui/dist
          if-no-files-found: error
  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-compiled on arm64: Intel runners are being retired.
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: ui-dist
      - run: cargo build --release --locked -p bridle --target ${{ matrix.target }}
      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="dev-${GITHUB_SHA::7}"
          scripts/package-release.sh "$tag" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/bridle" dist ui-dist
      - uses: actions/upload-artifact@v4
        with:
          name: bridle-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
